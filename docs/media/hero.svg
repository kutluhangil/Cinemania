  <text class="ink muted" x="600" y="404" text-anchor="middle">CATALOGUE SEARCH · YEAR FILTER</text>
  <text class="ink muted" x="1136" y="404" text-anchor="end">DARK / LIGHT · MY LIBRARY</text>
</g>
